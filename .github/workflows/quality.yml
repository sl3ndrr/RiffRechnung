name: Quality

on:
  pull_request:
  workflow_call:
    inputs:
      upload-pages-artifact:
        description: Upload the checked build for Pages in this workflow run
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Record source and tool versions
        run: |
          git rev-parse HEAD
          node --version
          npm --version
          python3 --version
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Disable unused runner Chrome APT source
        # Tests download pinned Playwright browsers. The runner's unrelated
        # Chrome mirror returned inconsistent package hashes in P12 CI.
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          import re
          for path in Path('/etc/apt/sources.list.d').iterdir():
              if path.suffix not in ('.list', '.sources'):
                  continue
              active = '\n'.join(line for line in path.read_text().splitlines() if not line.lstrip().startswith('#'))
              if 'dl.google.com/linux/chrome-stable/deb' not in active:
                  continue
              urls = re.findall(r'https?://[^\s]+', active)
              if any(not url.startswith('https://dl.google.com/linux/chrome-stable/deb') for url in urls):
                  raise SystemExit(f'Refusing to disable mixed APT source: {path}')
              path.rename(path.with_suffix(path.suffix + '.disabled'))
              print(f'Disabled unrelated runner Chrome source: {path.name}')
          PY
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Install PDF text verification
        run: sudo apt-get install -y poppler-utils
      - run: npm run test:browser
      - name: Audit all locked dependencies
        shell: bash
        run: |
          mkdir -p test-results
          npm audit --json | tee test-results/npm-audit.json
      - name: Browser failure context
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('test-results').rglob('error-context.md'):
              print(str(path))
              print(path.read_text()[:20000])
          PY
      - name: Preserve synthetic browser and PDF evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: browser-evidence
          path: test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload checked Pages build
        if: inputs.upload-pages-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
